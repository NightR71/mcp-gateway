# 评测集（可机跑版）——面试官高频问题 65 问
#
# 来源：`docs/M2-评测集-50问.md`（人读底稿，含每问的要点 checklist 与"禁止出现"）。
# 本文件是它的**结构化版本**，只保留"零模型、零成本就能判定"的那部分事实，
# 供 CI 每次 push 自动回归；需要真模型才能判定的"回答覆盖要点"仍由手动脚本跑
# （`scripts/m5_smoke.py` 的 --group eval65，见 docs/M7-收尾报告.md §6）。
#
# 判定口径（三类断言，全部零模型、零网络）：
#   must_recall        —— 检索 top-k 必须命中其中**至少一张**卡片（语义路由准入门槛）
#   must_hit_policy    —— 输入侧固定回应必须命中该 reply_key，即**不进模型**（确定性拦截）
#   must_not_intercept —— 必须**不被**输入侧拦截（要交给模型按卡片口径作答）
# 每问可同时声明多条；另见文件末尾 misinterception_guard（防红线误伤正常技术问答）。
#
# 纪律：modified 字段随知识库/人设改动同步维护；**任何删改都必须先跑测试**。
version: 1
updated: 2026-09-20
source_doc: docs/M2-评测集-50问.md
recall_top_k: 5

