# 防「红线误伤」：这些是**正常技术问答**，红线词表不得把它们拦掉
# （触发词 + scope_hints 的组合正是为此存在的——一旦有人放宽词表，这里立刻红）。
misinterception_guard:
  - id: M1
    question: 网关这个项目做过性能优化吗
    note: 命中的词是「性能优化」，但不属于海洋数据话题域（scope_hints 应把它放行）
  - id: M2
    question: 大模型输出不稳定，客服场景怎么处理大数据量
    note: 「大数据量」在其他话题域下不应触发海洋实习的固定话术
  - id: M3
    question: 你们团队怎么做接口测试的
    note: 「接口测试」不含红线触发词，必须走正常检索与作答
