[project]
name = "mcp-gateway"
version = "0.1.0"
description = "统一接入并管理多个 MCP Server 的企业级工具网关"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "mcp>=1.9.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[[tool.uv.index]]
# 新版 uv 要求 index 条目必须带 name（Vercel 构建机用的即是新版）
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
