# Vercel Serverless 部署专用配置（Vercel 项目环境变量设 GATEWAY_CONFIG_FILE=config/gateway.vercel.yaml）
# 与本地配置的差异：Vercel Functions 文件系统只读（/tmp 除外），SQLite 必须落 /tmp
gateway:
  app_name: mcp-gateway
  log_level: INFO

auth:
  db_path: /tmp/gateway.db
  api_keys:
    - key: dev-key-please-change
      name: demo
      rate_limit_per_minute: 60

# demo server 仍走 stdio（同实例子进程）；
# 其子进程 SQLite 路径由 Vercel 环境变量 DEMO_SQL_DB_PATH=/tmp/demo_sql.db 指定
# 注意：Vercel 是 Linux 运行时，python 命令不一定存在，必须用 python3
servers:
  - name: demo_sql
    transport: stdio
    command: python3
    args: ["servers/demo_sql_server/server.py"]
