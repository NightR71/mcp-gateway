<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Agent Workbench</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header id="status-bar">
    <div class="brand-block">
      <span class="brand">MCP Agent Workbench</span>
      <span class="brand-desc">项目演示界面：输入中文问题，观察网关 Agent 完成「鉴权限流 → 工具路由 → MCP 调用 → 流式回答」的完整链路</span>
    </div>
    <span id="tool-count" class="pill" title="网关聚合工具数 / 本轮注入数">工具: -/- · 注入: -</span>
    <span id="round-info" class="pill hidden">轮数: -</span>
    <span id="gateway-url" class="pill">网关: 本机</span>
    <label class="key-label" for="api-key">Key
      <input id="api-key" type="password" placeholder="X-API-Key" autocomplete="off" title="本地演示 Key 见 config/gateway.yaml；Key 只放在请求头，不写入 localStorage" />
    </label>
  </header>

  <main id="layout">
    <section id="timeline" aria-live="polite">
      <div class="empty-hint">输入问题开始一次 Agent 任务（工具选择 → 网关执行 → 结果回填 → 最终回答）；右侧同步演示运行流程。</div>
    </section>

    <aside id="sidebar">
      <div class="side-card" id="flow-panel">
        <div class="flow-head">
          <span class="flow-title">运行流程</span>
          <span id="flow-status" class="flow-status idle">待机</span>
          <button id="flow-pause-btn" class="mini ghost" type="button" disabled>暂停</button>
          <button id="flow-replay-btn" class="mini ghost" type="button">播放/重播</button>
        </div>

        <div id="flow-stage">
          <svg viewBox="0 0 380 640" width="100%" role="img" aria-label="MCP Gateway 运行流程图">
            <defs>
              <pattern id="flow-grid" width="22" height="22" patternUnits="userSpaceOnUse">
                <path d="M22 0H0V22" fill="none" stroke="rgba(148,163,184,0.07)" stroke-width="0.5" />
              </pattern>
              <radialGradient id="flow-bg" cx="50%" cy="26%" r="85%">
                <stop offset="0%" stop-color="rgba(47,129,247,0.12)" />
                <stop offset="100%" stop-color="rgba(13,17,23,0)" />
              </radialGradient>
              <marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="rgba(148,163,184,0.55)" />
              </marker>
            </defs>

            <rect x="0" y="0" width="380" height="640" fill="url(#flow-bg)" />
            <rect x="0" y="0" width="380" height="640" fill="url(#flow-grid)" />

            <!-- 出站链路（贝塞尔曲线） -->
            <path id="fp12" class="flow-link" d="M 162 60 C 162 80, 218 80, 218 100" marker-end="url(#flow-arrow)" />
            <path id="fp23" class="flow-link" d="M 218 140 C 218 160, 162 160, 162 180" marker-end="url(#flow-arrow)" />
            <path id="fp34" class="flow-link" d="M 162 220 C 162 240, 218 240, 218 260" marker-end="url(#flow-arrow)" />
            <path id="fp45" class="flow-link" d="M 218 300 C 218 320, 162 320, 162 340" marker-end="url(#flow-arrow)" />
            <path id="fp56" class="flow-link" d="M 162 380 C 162 400, 218 400, 218 420" marker-end="url(#flow-arrow)" />
            <path id="fp67" class="flow-link" d="M 218 460 C 218 480, 162 480, 162 500" marker-end="url(#flow-arrow)" />
            <path id="fp78" class="flow-link" d="M 162 540 C 162 560, 218 560, 218 580" marker-end="url(#flow-arrow)" />
            <!-- 回程：结果回填（左侧）与流式回答（右侧） -->
            <path id="fpRet" class="flow-link ret" d="M 133 600 C 32 600, 32 280, 133 280" marker-end="url(#flow-arrow)" />
            <path id="fpAns" class="flow-link ans" d="M 303 280 C 348 280, 348 40, 247 40" marker-end="url(#flow-arrow)" />

            <!-- 节点：用户 → 网关 → 路由 → 模型 → 注册中心 → MCP 客户端 → demo server → SQLite -->
            <g class="flow-node" id="n1">
              <rect x="77" y="20" width="170" height="40" rx="10" />
              <text class="nt" x="162" y="37" text-anchor="middle">用户</text>
              <text class="ns" x="162" y="53" text-anchor="middle">浏览器工作台</text>
            </g>
            <g class="flow-node" id="n2">
              <rect x="133" y="100" width="170" height="40" rx="10" />
              <text class="nt" x="218" y="117" text-anchor="middle">Gateway 网关</text>
              <text class="ns" x="218" y="133" text-anchor="middle">鉴权 · 限流 · SSE</text>
            </g>
            <g class="flow-node" id="n3">
              <rect x="77" y="180" width="170" height="40" rx="10" />
              <text class="nt" x="162" y="197" text-anchor="middle">ToolRouter</text>
              <text class="ns" x="162" y="213" text-anchor="middle">语义筛选 top-k</text>
            </g>
            <g class="flow-node" id="n4">
              <rect x="133" y="260" width="170" height="40" rx="10" />
              <text class="nt" x="218" y="277" text-anchor="middle">Agent · 模型</text>
              <text class="ns" x="218" y="293" text-anchor="middle">AgentRunner + Model</text>
            </g>
            <g class="flow-node" id="n5">
              <rect x="77" y="340" width="170" height="40" rx="10" />
              <text class="nt" x="162" y="357" text-anchor="middle">Registry</text>
              <text class="ns" x="162" y="373" text-anchor="middle">{server}__{tool} 路由</text>
            </g>
            <g class="flow-node" id="n6">
              <rect x="133" y="420" width="170" height="40" rx="10" />
              <text class="nt" x="218" y="437" text-anchor="middle">MCP Client</text>
              <text class="ns" x="218" y="453" text-anchor="middle">stdio/http/inprocess</text>
            </g>
            <g class="flow-node" id="n7">
              <rect x="77" y="500" width="170" height="40" rx="10" />
              <text class="nt" x="162" y="517" text-anchor="middle">demo_sql_server</text>
              <text class="ns" x="162" y="533" text-anchor="middle">NL2SQL 双引擎</text>
            </g>
            <g class="flow-node" id="n8">
              <rect x="133" y="580" width="170" height="40" rx="10" />
              <text class="nt" x="218" y="597" text-anchor="middle">SQLite</text>
              <text class="ns" x="218" y="613" text-anchor="middle">只读 SQL · max 50 行</text>
            </g>

            <!-- 数据流光点（由 app.js 驱动） -->
            <circle id="flow-dot" class="flow-dot" r="4.5" opacity="0" />
          </svg>
        </div>

        <div class="flow-caption">
          <span id="flow-caption-text">点击「发送」或「播放/重播」触发演示：光点沿调用链流动（动画与真实请求异步，仅作链路可视化）。</span>
        </div>
      </div>
    </aside>
  </main>

  <footer id="input-bar">
    <input id="question" type="text" placeholder="例如：查询目前销售额最高的商品" autocomplete="off" />
    <button id="send-btn" type="button">发送</button>
    <button id="health-btn" class="ghost" type="button">健康检查</button>
    <button id="tools-btn" class="ghost" type="button">列出工具</button>
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
